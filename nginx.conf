events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name automation-cicd.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name automation-cicd.duckdns.org;
        
        ssl_certificate /etc/letsencrypt/live/automation-cicd.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/automation-cicd.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://node-app:3000;
        }
    }
}
